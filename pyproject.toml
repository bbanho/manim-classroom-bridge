[project]
name = "manim-classroom-bridge"
version = "0.1.0"
description = "AI-generated Manim videos → Google Classroom"
requires-python = ">=3.11"
dependencies = [
    "manim-ce>=0.19",
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-httplib2>=0.2",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.4",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = false
disallow_untyped_defs = true
show_error_codes = true
namespace_packages = true

[tool.ruff]
line-length = 100
target-version = "py311"
